plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeModule 'maven.modrinth', 'T9PomCSv' }
    }
    maven {
        url = 'https://maven.ryanhcode.dev/releases'
        content { includeGroup 'dev.ryanhcode.sable-companion' }
    }
    maven {
        url = 'https://maven.squiddev.cc'
        content { includeGroup 'cc.tweaked' }
    }
}

dependencies {
    compileOnly 'maven.modrinth:T9PomCSv:fg9dTRz9' // Sable NeoForge 2.0.6
    compileOnly 'dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0'
    compileOnly "cc.tweaked:cc-tweaked-1.21.1-forge-api:${cc_tweaked_version}"
    testImplementation 'junit:junit:4.13.2'
}

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        configureEach {
            gameDirectory = project.file("runs/${name}")
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.test)
tasks.named('test', Test) {
    def mainJavaSources = layout.projectDirectory.dir('src/main/java')
    useJUnit()
    workingDir layout.buildDirectory
    systemProperty 'blockspaceprogram.mainJavaSources', mainJavaSources.asFile.absolutePath
    inputs.dir(mainJavaSources).withPathSensitivity(PathSensitivity.RELATIVE)
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var properties = [
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            cc_tweaked_version     : cc_tweaked_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties properties
    filteringCharset = 'UTF-8'
    expand properties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir generateModMetadata
    exclude '**/.cache/**'
}

neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar) {
    from 'LICENSE', 'TEMPLATE_LICENSE.txt'
}

apply from: 'gradle/check-lang.gradle'

if (providers.gradleProperty('physicsDrop').isPresent()) {
    apply from: 'experiments/physics-drop/physics-drop.gradle'
}

if (providers.gradleProperty('shipRigidBody').isPresent()) {
    apply from: 'experiments/ship-rigidbody/ship-rigidbody.gradle'
}

if (providers.gradleProperty('candidateDimensions').isPresent()) {
    apply from: 'experiments/candidate-dimensions/candidate-dimensions.gradle'
}

if (providers.gradleProperty('starSystem').isPresent()) {
    apply from: 'experiments/star-system/star-system.gradle'
}
