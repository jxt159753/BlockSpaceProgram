name: Build

on: push

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build with Gradle
        run: ./gradlew build --no-daemon
      - name: Test browser orbital propagation
        run: node --test src/test/js/kepler.test.mjs

      - name: Upload mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: blockspaceprogram-jar
          path: build/libs/*.jar
          if-no-files-found: error
