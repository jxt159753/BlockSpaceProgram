modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/jxt159753/BlockSpaceProgram/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/jxt159753/BlockSpaceProgram"
logoFile = "blockspaceprogram.png"
authors = "jxt159753"
description = "A Minecraft mod about building spacecraft from blocks and flying them into orbit. 用方块搭建飞船并飞向轨道的 Minecraft 模组。"

[[mixins]]
config = "blockspaceprogram.mixins.json"

[[mixins]]
config = "blockspaceprogram.assembly.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "sable"
type = "optional"
versionRange = "[2.0.6]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "computercraft"
type = "optional"
versionRange = "[${cc_tweaked_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ftbteams"
type = "optional"
versionRange = "[2101.1.12,)"
ordering = "AFTER"
side = "BOTH"
