def gameDir = file('runs/shipRigidBody')

sourceSets {
    shipRigidBody {
        java.srcDirs = ['experiments/ship-rigidbody/java']
        resources.srcDirs = ['experiments/ship-rigidbody/resources']
    }
}

neoForge.addModdingDependenciesTo(sourceSets.shipRigidBody)
neoForge.mods[mod_id].sourceSet(sourceSets.shipRigidBody)
neoForge.runs.register('shipRigidBody') {
    server()
    gameDirectory = gameDir
    programArgument '--nogui'
}

tasks.named('runShipRigidBody', JavaExec) {
    standardInput = System.in
}

dependencies {
    shipRigidBodyCompileOnly sourceSets.main.output
}

configurations.shipRigidBodyCompileOnly.extendsFrom(configurations.compileOnly)
