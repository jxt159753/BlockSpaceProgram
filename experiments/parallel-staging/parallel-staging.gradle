def experiment = 'experiments/parallel-staging'
def root = layout.projectDirectory.asFile
def patch = file("${experiment}/parallel-staging.patch")
def generatedJava = layout.buildDirectory.dir('generated/sources/parallelStaging')
def prepareSources = tasks.register('prepareParallelStagingSources', Sync) {
    from 'src/main/java'
    into generatedJava
    inputs.file patch
    doLast {
        def relativeDir = root.toPath().relativize(destinationDir.toPath()).toString().replace('\\', '/')
        def process = new ProcessBuilder('git', 'apply', '--ignore-space-change',
                "--directory=${relativeDir}", patch.absolutePath).directory(root).redirectErrorStream(true).start()
        def output = process.inputStream.getText('UTF-8')
        if (process.waitFor() != 0) {
            throw new GradleException("Could not apply the parallel staging experiment:\n${output}")
        }
    }
}

sourceSets.main.java.setSrcDirs([generatedJava, "${experiment}/java"])
sourceSets.test.java.srcDir 'src/test/parallel-staging'
tasks.named('compileJava') {
    dependsOn prepareSources
}

def runName = providers.gradleProperty('parallelStagingWithoutSable').isPresent()
        ? 'parallelStagingWithoutSable' : 'parallelStaging'
def installFixture = tasks.register('installParallelStagingFixture', Copy) {
    from "${experiment}/datapack"
    into "runs/${runName}/parallel-staging/datapacks/parallel-staging"
}
neoForge.runs.register('parallelStaging') {
    server()
    gameDirectory = file("runs/${runName}")
    programArgument '--nogui'
    systemProperty 'bsp.parallelStaging.verify', 'true'
    systemProperty 'bsp.parallelStaging.expectSable', (runName == 'parallelStaging').toString()
}

tasks.named('runParallelStaging', JavaExec) {
    dependsOn installFixture
    standardInput = System.in
}
